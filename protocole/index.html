const un64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = "vita-key-" + SALT.slice(0, 8);
async function unlock(keyRaw) {
  const key = await crypto.subtle.importKey("raw", keyRaw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: un64(IV) }, key, un64(DATA));
  return new TextDecoder().decode(plain);
}
// Le site ne remplace la page qu'une fois celle-ci entièrement chargée (sinon il s'ajoute en dessous)
const loaded = () => new Promise(r => document.readyState === "complete" ? r() : window.addEventListener("load", () => r(), { once: true }));
async function show(html) { await loaded(); document.open(); document.write(html); document.close(); }
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: un64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256));
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (saved) {
    const f = document.getElementById("f"); f.style.visibility = "hidden";
    try { await show(await unlock(un64(saved))); return; }
    catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} f.style.visibility = ""; }
  }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Ouverture…"; err.textContent = "";
  try {
    const raw = await derive(document.getElementById("pw").value);
    const html = await unlock(raw);
    if (document.getElementById("rem").checked) {
      try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e2) {}
    }
    await show(html);
  } catch (x) {
    btn.disabled = false; btn.textContent = "Entrer";
    err.textContent = "Mot de passe incorrect.";
  }
});
})();
